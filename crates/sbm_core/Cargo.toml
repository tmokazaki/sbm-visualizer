[package]
name = "sbm_core"
version = "0.2.0"
edition = "2021"
description = "NASA EVOLVE 4.0 Standard Breakup Model (SBM) core physics and orbital debris simulation engine"
license = "MIT OR Apache-2.0"
authors = ["Antigravity Engineering Team"]
readme = "README.md"
keywords = ["astrodynamics", "orbital-debris", "breakup-model", "space", "nasa"]
categories = ["science", "simulation"]

[dependencies]
tracing = { version = "0.1", default-features = false }

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
