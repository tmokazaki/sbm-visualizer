[package]
name = "sbm_avoidance"
version = "0.1.0"
edition = "2021"
description = "Autonomous satellite trajectory optimization and space debris avoidance via Proximal Policy Optimization (PPO)"
license = "MIT OR Apache-2.0"
authors = ["Antigravity Engineering Team"]

[dependencies]
sbm_core = { path = "../sbm_core" }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = { version = "0.1", default-features = false }

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
