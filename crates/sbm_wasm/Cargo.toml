[package]
name = "sbm_wasm"
version = "0.1.0"
edition = "2021"
description = "WebAssembly high-performance astrodynamics & physics calculation engine"
license = "MIT OR Apache-2.0"
authors = ["Antigravity Engineering Team"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sbm_core = { path = "../sbm_core" }
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1.0"
js-sys = "0.3"

[dev-dependencies]
wasm-bindgen-test = "0.3"
